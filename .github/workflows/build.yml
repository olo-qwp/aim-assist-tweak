name: Build DEB

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld ldid fakeroot dpkg-dev perl curl

      - name: Setup Theos
        run: |
          export THEOS=/opt/theos
          sudo mkdir -p $THEOS
          sudo chown -R $(whoami) $THEOS
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV

      - name: Download SDK
        run: |
          # Download iOS SDK for cross-compilation
          SDK_URL="https://github.com/theos/sdks/archive/refs/heads/master.tar.gz"
          curl -fsSL "$SDK_URL" | tar xz
          mkdir -p /opt/theos/sdks
          # If sdks-master contains iPhoneOS SDK, copy it
          if [ -d sdks-master ]; then
            find sdks-master -name "iPhoneOS*.sdk" -exec cp -r {} /opt/theos/sdks/ \;
          fi
          # Fallback: create symlink to system SDKs if needed
          ls -la /opt/theos/sdks/ || echo "No SDK found, will use system"

      - name: Download ImGui
        run: |
          IMGUI_VER="v1.91.0"
          curl -fsSL "https://github.com/ocornut/imgui/archive/refs/tags/${IMGUI_VER}.tar.gz" | tar xz
          mkdir -p ImGui
          cp imgui-1.91.0/*.h ImGui/
          cp imgui-1.91.0/*.cpp ImGui/
          cp imgui-1.91.0/backends/imgui_impl_metal.h ImGui/
          cp imgui-1.91.0/backends/imgui_impl_metal.mm ImGui/
          rm -rf imgui-1.91.0
          echo "ImGui files downloaded:"
          ls -la ImGui/

      - name: Build Package
        run: |
          make package FINALPACKAGE=1

      - name: List Packages
        run: |
          echo "=== Built packages ==="
          find packages -type f -name "*.deb" -exec ls -lh {} \;

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AimAssist-DEB
          path: packages/*.deb
          retention-days: 90

      - name: Create Release and Upload DEB
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          name: "AimAssist Nightly Build"
          tag_name: "nightly"
          prerelease: true
          files: packages/*.deb
          body: |
            ## AimAssist 自动构建

            - 构建时间: ${{ github.event.head_commit.timestamp || 'now' }}
            - 提交: ${{ github.sha }}
            - 直接下载: 见下方 Assets

            ### 安装说明
            1. 下载 deb 文件
            2. 使用 iGameGod 或 Filza 安装
            3. 重启用户空间 (sbreload)
            4. 在设置中启用目标应用

            ### 兼容性
            - Dopamine 2.5 beta 4+ (rootless)
            - iOS 15.0+
            - arm64 架构