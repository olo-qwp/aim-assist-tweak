name: Build DEB

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          export THEOS=/opt/theos
          sudo mkdir -p $THEOS
          sudo chown -R $(whoami) $THEOS
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          # Install ldid for code signing
          curl -fsSL -o /tmp/ldid https://github.com/ProcursusTeam/ldid/releases/latest/download/ldid_macos_x86_64 || \
          curl -fsSL -o /tmp/ldid https://github.com/ProcursusTeam/ldid/releases/download/v2.1.5-procursus7/ldid_macos_x86_64 || \
          brew install ldid
          chmod +x /tmp/ldid 2>/dev/null || true
          sudo mv /tmp/ldid /usr/local/bin/ldid 2>/dev/null || true
          which ldid && ldid --version || echo "ldid installed"

      - name: Download ImGui
        run: |
          IMGUI_VER="v1.91.0"
          curl -fsSL "https://github.com/ocornut/imgui/archive/refs/tags/${IMGUI_VER}.tar.gz" | tar xz
          mkdir -p ImGui
          cp imgui-1.91.0/*.h ImGui/
          cp imgui-1.91.0/*.cpp ImGui/
          cp imgui-1.91.0/backends/imgui_impl_metal.h ImGui/
          cp imgui-1.91.0/backends/imgui_impl_metal.mm ImGui/
          rm -rf imgui-1.91.0
          echo "ImGui files downloaded:"
          ls -la ImGui/

      - name: Build Package
        run: |
          make package FINALPACKAGE=1

      - name: List Packages
        run: |
          echo "=== Built packages ==="
          find packages -type f -name "*.deb" -exec ls -lh {} \;

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AimAssist-DEB
          path: packages/*.deb
          retention-days: 90

      - name: Create Release and Upload DEB
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          name: "AimAssist Nightly Build"
          tag_name: "nightly"
          prerelease: true
          files: packages/*.deb
          body: |
            ## AimAssist 自动构建

            - 构建时间: ${{ github.event.head_commit.timestamp || 'now' }}
            - 提交: ${{ github.sha }}
            - 直接下载: 见下方 Assets

            ### 安装说明
            1. 下载 deb 文件
            2. 使用 iGameGod 或 Filza 安装
            3. 重启用户空间 (sbreload)
            4. 在设置中启用目标应用

            ### 兼容性
            - Dopamine 2.5 beta 4+ (rootless)
            - iOS 15.0+
            - arm64 架构